exclude: "^zola-site/public/"
repos:
  # ── General file hygiene ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=1024]

  # ── Markdown linting ──────────────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yaml]

  # ── Prettier: HTML / CSS / JS / JSON / YAML formatting ───────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [yaml, json, css, javascript]
        # HTML templates are excluded: Zola's Tera syntax confuses prettier
        exclude: "zola-site/templates/.*\\.html$"

  # ── Rust: WASM engine formatting & linting ────────────────────────────────
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        args: ["--manifest-path", "wasm-engine/Cargo.toml"]
        pass_filenames: false
      - id: clippy
        args: ["--manifest-path", "wasm-engine/Cargo.toml", "--", "-D", "warnings"]
        pass_filenames: false
