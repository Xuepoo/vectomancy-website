<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vectomancy - Image to Parametric Equation Converter{% endblock title %}</title>

    <!-- Performance Optimization -->
    <link rel="dns-prefetch" href="https://cdn.xuepoo.xyz">
    <link rel="preload" href="/fonts/pressstart2p.woff2" as="font" type="font/woff2">
    <link rel="preload" href="/css/nes.min.css" as="style">

    <!-- SEO Meta Tags -->
    <meta name="description" content="A blazing fast Rust and WebAssembly tool to convert raster images into mathematical parametric equations, Fourier series vectors, and Zhang-Suen thinned SVGs.">
    <meta name="keywords" content="Image to parametric equation converter online, Fourier series vector animation generator, Online Zhang-Suen thinning tool, Raster to SVG math art, Vectomancy, WebAssembly, Rust">

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ config.base_url }}/">
    <meta property="og:title" content="Vectomancy - Math Art Generator">
    <meta property="og:description" content="Convert raster images into mathematical vectors using Fourier series and Zhang-Suen thinning. Fully open-source and powered by Rust.">
    <meta property="og:image" content="{{ config.base_url }}/examples/fuji.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{ config.base_url }}/">
    <meta property="twitter:title" content="Vectomancy - Math Art Generator">
    <meta property="twitter:description" content="Convert raster images into mathematical vectors using Fourier series and Zhang-Suen thinning.">
    <meta property="twitter:image" content="{{ config.base_url }}/examples/fuji.png">

    <!-- Fonts & CSS -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicons/favicon.ico">
    <link href="/css/nes.min.css" rel="stylesheet" />
    <style>
        @font-face {
            font-family: 'Press Start 2P';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('/fonts/pressstart2p.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        :root {
            --bg-color: #f7f7f7;
            --text-color: #212529;
            --container-bg: #fff;
            --footer-text: #555;
        }
        body.dark-theme {
            --bg-color: #1a1a1a;
            --text-color: #d3d3d3;
            --container-bg: #212529;
            --footer-text: #999;
        }
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            margin-top: 50px;
            margin-bottom: 50px;
            text-align: center;
        }
        .logo-img {
            width: 64px;
            height: 64px;
            image-rendering: pixelated;
            margin-bottom: 20px;
        }
        footer {
            margin-top: 80px;
            text-align: center;
            font-size: 10px;
            color: var(--footer-text);
        }
        a {
            color: #209cee;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    {% block extra_head %}{% endblock extra_head %}
</head>
<body>
    {% block content %}
    {% endblock content %}

    <!-- Retro Feedback UI -->
    <button type="button" class="nes-btn is-primary" id="btn-open-feedback" style="position: fixed; bottom: 30px; right: 30px; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        <i class="nes-icon is-small heart"></i> Feedback
    </button>

    <dialog class="nes-dialog" id="dialog-feedback">
      <form method="dialog">
        <p class="title">Send Feedback</p>
        <div class="nes-field">
          <textarea id="feedback_textarea" class="nes-textarea" placeholder="Found a bug or have an idea?" style="min-height: 120px; font-family: inherit; font-size: 12px;"></textarea>
        </div>
        <menu class="dialog-menu" style="margin-top: 20px; display: flex; justify-content: space-between;">
          <button class="nes-btn">Cancel</button>
          <button class="nes-btn is-success" id="btn-submit-feedback" type="button">Submit</button>
        </menu>
      </form>
    </dialog>

    <script>
      document.getElementById('btn-open-feedback').addEventListener('click', function() {
          document.getElementById('dialog-feedback').showModal();
      });

      document.getElementById('btn-submit-feedback').addEventListener('click', async function() {
          const textarea = document.getElementById('feedback_textarea');
          const text = textarea.value.trim();
          if (!text) return;

          const btn = this;
          btn.innerText = "Sending...";
          btn.classList.add('is-disabled');

          try {
              const res = await fetch('/api/feedback', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ message: text })
              });
              if (res.ok) {
                  textarea.value = '';
                  document.getElementById('dialog-feedback').close();
                  alert("Thanks for your feedback! The developer will check it soon.");
              } else {
                  alert("Failed to send feedback.");
              }
          } catch (e) {
              alert("Network error.");
          } finally {
              btn.innerText = "Submit";
              btn.classList.remove('is-disabled');
          }
      });
    </script>
</body>
</html>
