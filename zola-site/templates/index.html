{% extends "base.html" %}

{% block extra_head %}
<style>
    .marquee-container {
        width: 100vw;
        position: relative;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
        overflow: hidden;
        white-space: nowrap;
        box-sizing: border-box;
        margin-top: 30px;
        padding: 15px 0;
        border-top: 4px solid var(--text-color);
        border-bottom: 4px solid var(--text-color);
        background: var(--container-bg);
    }
    .marquee-content {
        display: inline-block;
        animation: marquee 30s linear infinite;
    }
    .marquee-content img {
        height: 380px;
        margin-right: 30px;
        border: 4px solid var(--text-color);
        image-rendering: auto;
        object-fit: contain;
        background: #fff;
    }
    body.dark-theme .marquee-content img { background: #333; }

    @keyframes marquee {
        0%   { transform: translate(0, 0); }
        100% { transform: translate(-50%, 0); }
    }

    /* Sticky footer styling */
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }
    body {
        display: flex;
        flex-direction: column;
    }
    .main-content-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
        .marquee-content img {
            height: 200px;
            margin-right: 15px;
            border-width: 2px;
        }
        .marquee-container {
            margin-top: 15px;
            padding: 10px 0;
        }
        header h1 {
            font-size: 20px !important;
        }
        header img.logo-img {
            width: 60px !important;
            height: 60px !important;
        }
    }

    /* Custom High-end 8-bit Pixel Discord Icon */
    .discord-link {
        position: fixed;
        bottom: 30px;
        left: 30px;
        z-index: 1000;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        color: var(--text-color);
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .discord-link:hover {
        transform: scale(1.15) translateY(-3px);
    }
    .discord-icon {
        width: 36px;
        height: 36px;
        image-rendering: pixelated;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15));
    }
</style>
{% endblock extra_head %}

<script>
    // System dark theme detection and localStorage persistence for the landing page
    let useDark = false;
    const sharedTheme = localStorage.getItem('vectomancy_theme');
    if (sharedTheme) {
        useDark = (sharedTheme === 'dark');
    } else {
        const stored = localStorage.getItem('vectomancy_user_settings');
        if (stored) {
            try {
                const settings = JSON.parse(stored);
                if (settings.theme === 'dark') useDark = true;
                else if (settings.theme === 'light') useDark = false;
            } catch(e) {}
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            useDark = true;
        }
    }

    if (useDark) {
        document.body.classList.add('dark-theme');
    }

    const themeBtn = document.getElementById('themeToggleBtn');
    if (themeBtn) {
        themeBtn.addEventListener('click', () => {
            const isDark = document.body.classList.toggle('dark-theme');
            try {
                const themeStr = isDark ? 'dark' : 'light';
                localStorage.setItem('vectomancy_theme', themeStr);
                localStorage.setItem('vectomancy_user_settings', JSON.stringify({
                    theme: themeStr
                }));
            } catch(e) {}
        });
    }
</script>
