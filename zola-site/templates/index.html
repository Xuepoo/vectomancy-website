{% extends "base.html" %}

{% block extra_head %}
<style>
    .marquee-container {
        width: 100vw;
        position: relative;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
        overflow: hidden;
        white-space: nowrap;
        box-sizing: border-box;
        margin-top: 30px;
        padding: 15px 0;
        border-top: 4px solid var(--text-color);
        border-bottom: 4px solid var(--text-color);
        background: var(--container-bg);
    }
    .marquee-content {
        display: inline-block;
        animation: marquee 30s linear infinite;
    }
    .marquee-content img {
        height: 380px;
        margin-right: 30px;
        border: 4px solid var(--text-color);
        image-rendering: auto;
        object-fit: contain;
        background: #fff;
    }
    body.dark-theme .marquee-content img { background: #333; }

    @keyframes marquee {
        0%   { transform: translate(0, 0); }
        100% { transform: translate(-50%, 0); }
    }

    /* Sticky footer styling */
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }
    body {
        display: flex;
        flex-direction: column;
    }
    .main-content-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
        .marquee-content img {
            height: 200px;
            margin-right: 15px;
            border-width: 2px;
        }
        .marquee-container {
            margin-top: 15px;
            padding: 10px 0;
        }
        header h1 {
            font-size: 20px !important;
        }
        header img.logo-img {
            width: 60px !important;
            height: 60px !important;
        }
    }
</style>
{% endblock extra_head %}

{% block content %}
<main class="main-content-wrapper">
    <!-- Top-left GitHub Link -->
    <a href="https://github.com/Xuepoo/vectomancy" target="_blank" style="position: absolute; top: 15px; left: 15px; z-index: 1000;" title="View on GitHub">
        <i class="nes-icon github"></i>
    </a>

    <div class="container" style="max-width: 1200px;">
        <header style="margin-top: 10px; margin-bottom: 10px;">
            <img src="/img/logo.svg" alt="Vectomancy Logo" class="logo-img" style="width: 70px; height: 70px; margin-bottom: 5px;" fetchpriority="high">
            <h1 style="margin-bottom: 5px; font-size: 26px;">VECTOMANCY</h1>
            <p style="line-height: 1.4; font-size: 11px; margin-bottom: 15px;">Transform images into pure mathematical equations and curves.</p>

            <div style="margin-top: 15px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
                <a href="/image" class="nes-btn is-primary">Image</a>
                <a href="/typography" class="nes-btn is-success">Text</a>
                <a href="/video" class="nes-btn is-primary">Video</a>
            </div>
        </header>
    </div>

    <!-- Full width gallery -->
    <div class="marquee-container" style="margin-top: 15px; padding: 10px 0;">
        <div class="marquee-content">
            <!-- Original set -->
            <img src="https://cdn.xuepoo.xyz/vectomancy/gallery/1-thumb.webp" width="268" height="400" alt="" fetchpriority="high">
            <img src="https://cdn.xuepoo.xyz/vectomancy/gallery/2-thumb.webp" width="267" height="400" alt="" fetchpriority="high">
            <img src="https://cdn.xuepoo.xyz/vectomancy/gallery/3-thumb.webp" width="595" height="400" alt="" decoding="async">
            <img src="https://cdn.xuepoo.xyz/vectomancy/gallery/4-thumb.webp" width="640" height="400" alt="" decoding="async">
            <img src="https://cdn.xuepoo.xyz/vectomancy/gallery/5-thumb.webp" width="566" height="400" alt="" decoding="async">
            <img src="https://cdn.xuepoo.xyz/vectomancy/gallery/6-thumb.webp" width="600" height="400" alt="" decoding="async">
            <img src="https://cdn.xuepoo.xyz/vectomancy/gallery/7-thumb.webp" width="320" height="400" alt="" decoding="async">
            <img src="https://cdn.xuepoo.xyz/vectomancy/gallery/8-thumb.webp" width="611" height="400" alt="" decoding="async">
            <!-- Duplicated set for infinite seamless scroll -->
            <img src="https://cdn.xuepoo.xyz/vectomancy/gallery/1-thumb.webp" width="268" height="400" alt="" loading="lazy" decoding="async">
            <img src="https://cdn.xuepoo.xyz/vectomancy/gallery/2-thumb.webp" width="267" height="400" alt="" loading="lazy" decoding="async">
            <img src="https://cdn.xuepoo.xyz/vectomancy/gallery/3-thumb.webp" width="595" height="400" alt="" loading="lazy" decoding="async">
            <img src="https://cdn.xuepoo.xyz/vectomancy/gallery/4-thumb.webp" width="640" height="400" alt="" loading="lazy" decoding="async">
            <img src="https://cdn.xuepoo.xyz/vectomancy/gallery/5-thumb.webp" width="566" height="400" alt="" loading="lazy" decoding="async">
            <img src="https://cdn.xuepoo.xyz/vectomancy/gallery/6-thumb.webp" width="600" height="400" alt="" loading="lazy" decoding="async">
            <img src="https://cdn.xuepoo.xyz/vectomancy/gallery/7-thumb.webp" width="320" height="400" alt="" loading="lazy" decoding="async">
            <img src="https://cdn.xuepoo.xyz/vectomancy/gallery/8-thumb.webp" width="611" height="400" alt="" loading="lazy" decoding="async">
        </div>
    </div>
</main>

<div class="container" style="max-width: 1200px; padding-bottom: 20px;">
    <footer style="margin-top: 20px;">
        <p>&copy; 2026 Vectomancy Project. Open-sourced under the MIT License.</p>
    </footer>
</div>

<script>
    // System dark theme detection and localStorage persistence for the landing page
    const stored = localStorage.getItem('vectomancy_user_settings');
    let useDark = false;
    if (stored) {
        try {
            const settings = JSON.parse(stored);
            if (settings.theme === 'dark') useDark = true;
            else if (settings.theme === 'light') useDark = false;
        } catch(e) {}
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        useDark = true;
    }

    if (useDark) {
        document.body.classList.add('dark-theme');
    }
</script>
{% endblock content %}
