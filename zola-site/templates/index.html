{% extends "base.html" %}

{% block extra_head %}
<style>
    .marquee-container {
        width: 100vw;
        position: relative;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
        overflow: hidden;
        white-space: nowrap;
        box-sizing: border-box;
        margin-top: 60px;
        padding: 30px 0;
        border-top: 4px solid var(--text-color);
        border-bottom: 4px solid var(--text-color);
        background: var(--container-bg);
    }
    .marquee-content {
        display: inline-block;
        animation: marquee 30s linear infinite;
    }
    .marquee-content img {
        height: 250px;
        margin-right: 30px;
        border: 4px solid var(--text-color);
        image-rendering: auto;
        object-fit: contain;
        background: #fff;
    }
    body.dark-theme .marquee-content img { background: #333; }

    @keyframes marquee {
        0%   { transform: translate(0, 0); }
        100% { transform: translate(-50%, 0); }
    }
</style>
{% endblock extra_head %}

{% block content %}
<div class="container" style="max-width: 1200px;">
    <header>
        <img src="/img/logo.svg" alt="Vectomancy Logo" class="logo-img" style="width: 96px; height: 96px;">
        <h1 style="margin-bottom: 20px;">VECTOMANCY</h1>
        <p style="line-height: 1.8; font-size: 14px;">Transform images into pure mathematical equations and curves.</p>

        <div style="margin-top: 40px; display: flex; justify-content: center; gap: 20px;">
            <a href="/app" class="nes-btn is-primary">Launch Playground</a>
            <a href="https://github.com/Xuepoo/vectomancy" target="_blank" class="nes-btn"><i class="nes-icon github"></i> GitHub</a>
        </div>
    </header>
</div>

<!-- Full width gallery -->
<div class="marquee-container">
    <div class="marquee-content">
        <!-- Original set -->
        <img src="https://dns.xuepoo.xyz/examples/01.jpg" alt="Preview">
        <img src="https://dns.xuepoo.xyz/examples/fuji.png" alt="Preview">
        <img src="https://dns.xuepoo.xyz/examples/hatsune_miku.jpg" alt="Preview">
        <img src="https://dns.xuepoo.xyz/examples/十角馆事件.jpg" alt="Preview">
        <img src="https://dns.xuepoo.xyz/examples/04.jpg" alt="Preview">
        <!-- Duplicated set for infinite seamless scroll -->
        <img src="https://dns.xuepoo.xyz/examples/01.jpg" alt="Preview">
        <img src="https://dns.xuepoo.xyz/examples/fuji.png" alt="Preview">
        <img src="https://dns.xuepoo.xyz/examples/hatsune_miku.jpg" alt="Preview">
        <img src="https://dns.xuepoo.xyz/examples/十角馆事件.jpg" alt="Preview">
        <img src="https://dns.xuepoo.xyz/examples/04.jpg" alt="Preview">
    </div>
</div>

<div class="container" style="max-width: 1200px;">
    <footer>
        <p>&copy; 2026 Vectomancy Project. Open-sourced under the MIT License.</p>
    </footer>
</div>

<script>
    // System dark theme detection for the landing page
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.body.classList.add('dark-theme');
    }
</script>
{% endblock content %}
