<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vectomancy - Video Engine (Coming Soon)</title>
    <meta name="description" content="Vectomancy Video Engine: Convert video frames into mathematical parametric equations. Coming soon.">

    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicons/favicon.ico">
    <link href="/css/nes.min.css" rel="stylesheet">
    <script src="/js/mp4box.all.min.js" defer></script>
    <script src="/js/webm-muxer.min.js" defer></script>
    <script src="/js/mp4-muxer.min.js" defer></script>
    <style>
        @font-face {
            font-family: 'Press Start 2P';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('/fonts/pressstart2p.woff2') format('woff2');
        }
        :root {
            --bg-color: #1a0a2e;
            --container-bg: #2d1b4e;
            --text-color: #e8d5ff;
            --accent-color: #d494fa;
            --glow: rgba(212, 148, 250, 0.4);
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow: hidden;
            text-align: left;
        }

        /* Scanline effect */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.15) 2px,
                rgba(0,0,0,0.15) 4px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            padding: 40px 20px;
        }

        .logo-area {
            margin-bottom: 30px;
        }

        .film-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
            animation: blink 2s step-start infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        h1 {
            font-size: 20px;
            margin: 0 0 8px;
            color: var(--accent-color);
            text-shadow: 0 0 20px var(--glow);
        }

        .subtitle {
            font-size: 8px;
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .nes-container {
            border-color: var(--accent-color) !important;
            background: rgba(45, 27, 78, 0.8);
            margin-bottom: 20px;
        }
        .nes-container.with-title > .title {
            background: var(--container-bg);
            color: var(--accent-color);
        }

        .feature-list {
            font-size: 8px;
            text-align: left;
            line-height: 2;
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .feature-list li::before {
            content: "▶ ";
            color: var(--accent-color);
        }

        .progress-bar-container {
            margin-top: 20px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        /* CRT flicker on hover */
        .nes-btn:hover {
            text-shadow: 0 0 8px var(--glow);
        }

        /* Stars background */
        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <!-- Stars BG -->
    <div class="stars" id="stars"></div>

    <div class="container-fluid" style="display: flex; flex-direction: row; width: 100vw; height: 100vh; overflow: hidden; padding: 10px; box-sizing: border-box; gap: 10px; z-index: 1;">
        <!-- Left Control Panel -->
        <div class="sidebar nes-container is-rounded with-title" style="width: 300px; display: flex; flex-direction: column; overflow-y: auto; gap: 12px; padding: 12px; background: rgba(45, 27, 78, 0.9); border-color: var(--accent-color) !important;">
            <a href="/" class="nes-btn" style="font-size: 8px; align-self: flex-start;">← Home</a>
            <p class="title" style="font-size: 10px; color: var(--accent-color); margin: 0;">Video Settings</p>

            <!-- Drag and Drop Zone -->
            <div id="drop-zone" class="nes-container is-rounded" tabindex="0" role="button" aria-label="Upload Video" style="border: 2px dashed var(--accent-color); padding: 10px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80px;">
                <p style="font-size: 8px; margin: 0;">Drag & Drop Video or Click to Upload</p>
                <input type="file" id="video-input" accept="video/mp4,video/webm,video/quicktime" aria-label="Video File Upload" style="display: none;" />
            </div>

            <div id="video-info" style="font-size: 8px; display: none;">
                <span class="nes-text is-success" id="info-name">File: None</span><br>
                <span id="info-resolution">Resolution: -</span><br>
                <span id="info-fps">FPS: -</span><br>
                <span id="info-frames">Frames: -</span>
            </div>

            <!-- Parameter Configs -->
            <div class="nes-field" style="margin: 0;">
                <label for="mode-select" style="font-size: 8px;">Mode Select</label>
                <div class="nes-select" style="margin-bottom: 8px;">
                    <select id="mode-select" style="font-size: 8px; padding: 4px;">
                        <option value="spline">Spline (Bezier)</option>
                        <option value="fourier">Fourier (Epicycle)</option>
                        <option value="chaikin">Chaikin (Polyline)</option>
                    </select>
                </div>
            </div>

            <div class="nes-field" style="margin: 0;">
                <label for="detail-slider" style="font-size: 8px;">Detail Level (<span id="detail-val">50</span>)</label>
                <input type="range" id="detail-slider" class="nes-slider" min="10" max="100" value="50" style="height: 12px;" />
            </div>

            <div class="nes-field" style="margin: 0;">
                <label for="min-path-slider" style="font-size: 8px;">Min Path Length (<span id="min-path-val">5</span>)</label>
                <input type="range" id="min-path-slider" class="nes-slider" min="1" max="30" value="5" style="height: 12px;" />
            </div>

            <!-- Color Control -->
            <div class="nes-field" style="margin: 0;">
                <label style="font-size: 8px; display: block; margin-bottom: 4px;">Colors</label>
                <label style="font-size: 8px; display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <input type="checkbox" class="nes-checkbox" id="color-checkbox" checked />
                    <span>Enable Colors</span>
                </label>
            </div>

            <!-- Output Muxer settings -->
            <div class="nes-field" style="margin: 0;">
                <label for="export-format" style="font-size: 8px;">Export Format</label>
                <div class="nes-select" style="margin-bottom: 8px;">
                    <select id="export-format" style="font-size: 8px; padding: 4px;">
                        <option value="webm">WebM (VP9)</option>
                        <option value="mp4">MP4 (H.264)</option>
                    </select>
                </div>
            </div>

            <button type="button" id="export-btn" class="nes-btn is-primary is-disabled" style="font-size: 8px; width: 100%; margin-top: auto;" disabled>Export Video</button>
        </div>

        <!-- Right Workspace -->
        <div class="workspace" style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;">
            <div class="nes-container is-rounded" style="padding: 6px; background: rgba(0, 0, 0, 0.4); display: flex; justify-content: center; align-items: center; border-color: var(--accent-color) !important;">
                <canvas id="preview-canvas" style="max-width: 100%; max-height: calc(100vh - 120px); width: 640px; height: 360px; background: #000;"></canvas>
            </div>

            <!-- Video Timeline controller -->
            <div id="timeline-controls" style="width: 100%; max-width: 650px; display: flex; flex-direction: column; margin-top: 10px; gap: 6px; display: none;">
                <div style="display: flex; align-items: center; width: 100%; gap: 10px;">
                    <button id="play-btn" type="button" class="nes-btn" style="font-size: 8px; padding: 4px 8px;">Play</button>
                    <input type="range" id="timeline-slider" class="nes-slider" min="0" max="100" value="0" aria-label="Video Timeline" style="flex: 1; height: 12px;" />
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 8px;">
                    <span id="time-display">00:00 / 00:00</span>
                    <span id="frame-display">Frame 0 / 0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Export Progress Dialog -->
    <dialog class="nes-dialog is-dark" id="progress-dialog" style="width: 90vw; max-width: 450px; border-color: var(--accent-color) !important; background: var(--container-bg);">
        <form method="dialog">
            <p class="title" style="font-size: 10px; color: var(--accent-color)">Generating Video</p>
            <p id="progress-status" style="font-size: 8px; color: #ccc;">Initializing Web Worker...</p>
            <div style="margin-bottom: 12px;">
                <progress id="export-progress" class="nes-progress is-primary" value="0" max="100" style="height: 12px;"></progress>
            </div>
            <menu class="dialog-menu" style="display: flex; justify-content: flex-end;">
                <button id="cancel-export-btn" class="nes-btn is-error" style="font-size: 8px;">Cancel</button>
            </menu>
        </form>
    </dialog>

    <script>
        // Generate twinkling stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1;
            star.style.cssText = `
                width: ${size}px;
                height: ${size}px;
                left: ${Math.random() * 100}%;
                top: ${Math.random() * 100}%;
                animation-duration: ${Math.random() * 3 + 1}s;
                animation-delay: ${Math.random() * 3}s;
            `;
            starsContainer.appendChild(star);
        }

        // Check for saved theme preference
        const stored = localStorage.getItem('vectomancy_user_settings');
        if (stored) {
            try {
                const settings = JSON.parse(stored);
                // Video page always uses its own dark purple theme
            } catch(e) {}
        }
    </script>
</body>
</html>
