# ── changelog.*
changelog_20260824_title = "[2026-08-24] - 中文上线 & Reveal 打磨"
changelog_20260824_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>简体中文上线：</strong>全站双语。中国大陆访客自动进入 <code>/zh/</code> 版本，每页均有 <code>EN | 中文</code> 切换器，
                中文以 CDN 下发的 12px 像素字体清晰呈现。
              </li><li style="margin-bottom: 5px;">
                <strong>Reveal 手感修复：</strong>动画全程遵循你的<strong>笔画粗细</strong>设置；
                <code>先黑白，后上色</code>结束后画面精确定格在最终帧，不再突然变色；
                上万路径的大图也因全新脏矩形合成器与批量描边而流畅播放。
              </li><li><strong>始终最新：</strong>静态资源带内容哈希，更新无需手动强刷即可生效。</li></ul>'''
changelog_20260823_title = "[2026-08-23] - 渐进显现登陆 Vectomancy Pro"
changelog_20260823_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>延迟渲染来了：</strong>作品不必再一次性全部出现。打开<a href="/zh/image/">图片</a>或
                <a href="/zh/typography/">文字</a>工具，在左侧边栏找到新增的 <code>Reveal</code> 面板。
              </li><li style="margin-bottom: 5px;">
                <strong>任选动画：</strong>方向扫掠（L→R、R→L、T→B、B→T）、对角线（TL→BR / BR→TL）、自中心径向扩散、
                逐笔 <code>Sequential Draw</code> 或 <code>Random Scatter</code>。拖动 <code>Duration</code> 滑块设定时长，
                按 <code>REPLAY</code> 随时重看。
              </li><li style="margin-bottom: 5px;">
                <strong>自定义径向原点：</strong>按住 <code>ALT</code> 点击画布任意位置——显现效果将从该点精确向外绽放。
              </li><li style="margin-bottom: 5px;">
                <strong>分阶段上色：</strong>勾选 <code>Mono first, color spreads</code>，先以单色画完整幅，
                再让真实色彩按各自的策略（<code>Color Spread</code>）与节奏（<code>Color Lag</code>）回填。
                彩色线稿与渐变图效果尤其惊艳！
              </li><li><strong>稳定性修复：</strong>修复了一个长期存在、会静默破坏整个 Playground 页面的脚本错误。</li></ul>'''
changelog_20260819_title = "[v8.1.0] - 2026-08-19"
changelog_20260819_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>更紧凑的 HTML 与 Desmos 方程：</strong>移除零系数项、恒等乘子与冗余符号；
                拼接不当的样条（Spline）项现在也会输出为合法表达式。
              </li><li style="margin-bottom: 5px;">
                <strong>正确的定义域与取景：</strong>样条导出改用真实的参数区间与端点；
                Desmos 与 SVG 以源图包围盒初始化，不再假设零起点坐标。
              </li><li>
                <strong>更安全的 JSON 与 SVG 渲染：</strong>拒绝非法的非有限 AST 值；
                SVG 傅里叶采样会根据活跃高频项自适应，避免走样或塌缩的路径。
              </li></ul>'''
changelog_20260816_title = "[2026-08-16] - Video 与 JSON Studio 移入 CLI"
changelog_20260816_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>Video 与 JSON Studio 网页下线：</strong>为保持站点轻量，这两个工具不再提供浏览器版本。
                两项功能在 CLI 中依旧完整可用——视频用 <code>vectomancy video input.mp4 -o output.mp4</code>；
                导出的 JSON 可在终端本地重渲染：<code>vectomancy render output.json -f svg -o out.svg</code>。
              </li></ul>'''
changelog_20260814_title = "[v8.0.0] - 2026-08-14"
changelog_20260814_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>CLI v2.0.0 发布：</strong>核心 <code>vectomancy</code> CLI 更新至 v2.0.0，包含关键的 SVG 导出与 JSON 渲染修复。
              </li><li style="margin-bottom: 5px;">
                <strong>SVG 线宽修复（#132）：</strong><code>vectomancy image -f svg --stroke-width X</code> 曾静默忽略 <code>X</code>——所有 SVG
                <code>&lt;path&gt;</code> 元素都被硬编码为 <code>stroke-width="1"</code>。现在该值会正确贯穿整个发射器管线
                （<code>emit_file</code> → <code>to_svg_string</code>）。
              </li><li>
                <strong>新增 <code>render</code> 子命令（#133）：</strong>载入先前导出的 JSON 直接重渲染，无需重跑分析管线。
                支持全部输出格式（<code>svg</code>、<code>png</code>、<code>jpg</code>、<code>webp</code>、<code>python</code>、
                <code>html</code>、<code>desmos</code>）。示例：
                <code>vectomancy render output.json -f svg --stroke-width 0.005 -o thin.svg</code>
              </li></ul>'''
changelog_20260813_v715_title = "[v7.1.5] - 2026-08-13"
changelog_20260813_v715_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>JSON Studio：</strong><code>/json-studio</code> 新增独立页面——载入导出的 JSON AST，
                即可自由调整线宽、颜色、背景与输出尺寸，实时重渲染，零 WASM 开销。
              </li><li style="margin-bottom: 5px;">
                <strong>线宽范围扩展（0.001 – 100 px）：</strong>三个工具（Image、Text、Video）现均支持低至 0.001 px。
                如此细的线条人眼不可见，多模态大模型却能从 PNG 原始像素值中完整解码。
              </li><li style="margin-bottom: 5px;"><strong>COPY 按钮：</strong>Image 与 Text 页面一键复制 PNG 到剪贴板。</li><li style="margin-bottom: 5px;">
                <strong>从 JSON 恢复：</strong>将先前导出的 JSON 文件直接载入 Image 或 Text 画廊，用不同视觉参数重新渲染。
              </li><li style="margin-bottom: 5px;">
                <strong>视频线宽修复：</strong>Video 页面新增线宽输入；<code>vectomancy video --stroke-width</code> 同步接入帧导出。
              </li><li>
                <strong>Typography 线宽修复：</strong><code>drawCachedPaths()</code> 渲染器此前忽略线宽输入，现已正确读取用户设定值。
              </li></ul>'''
changelog_20260813_maintenance_title = "[2026-08-13] - 维护与体验优化"
changelog_20260813_maintenance_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>SVG 导出坐标修复：</strong>导出图像不再缩在左上角——引擎现在会把 SVG viewBox 正确映射到输出画布，
                并遵循 <code>preserveAspectRatio</code>（xMidYMid meet）。
              </li><li style="margin-bottom: 5px;">
                <strong>依赖升级：</strong>升级到 <code>usvg 0.48</code> 与 <code>kiddo 6</code>，带来最新的 SVG 解析改进，
                TSP 路由的最近邻查询也更快。
              </li><li style="margin-bottom: 5px;">
                <strong>默认线宽 2.0px：</strong>CLI 与两个网页工具的默认线宽统一改为 2.0 px（原为 1.0 px），
                开箱即用的出图质量更好。
              </li><li>
                <strong>线宽输入：</strong>线宽控件由滑块改为数字输入框——可输入 0.01 至 5.00 的任意值，
                拖动误触不会再引发意外重绘。
              </li></ul>'''
changelog_20260731_title = "[v7.1.3] - 2026-07-31"
changelog_20260731_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>骨架提取质量：</strong>光栅管线现在运行完整的 Zhang-Suen 细化，并支持端点/环路感知的路径追踪，
                与参考解析器对齐——此前简化的贪心游走会产生碎片化、带噪点的骨架，且在第一个分叉点就中断。
              </li><li>
                <strong>发布管线加固：</strong>所有 workspace crate 清单现在同步升版；发布流程遇到清单/标签版本不一致时
                会先快速失败，不再误发布。
              </li></ul>'''
changelog_20260729_title = "[v7.1.0] - 2026-07-29"
changelog_20260729_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>Workspace Crate 解耦：</strong>引擎拆分为六个可独立发布的 crate——
                <code>vectomancy-geometry</code>、<code>vectomancy-transform</code>、<code>vectomancy-raster</code>、<code>vectomancy-svg</code>、
                <code>vectomancy-export</code>、<code>vectomancy-pipeline</code>——各自独立版本化与测试，门面（facade）保持即插即用兼容。
              </li></ul>'''
changelog_20260724_v700_title = "[v7.0.0] - 2026-07-24"
changelog_20260724_v700_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>多核光栅管线：</strong>Sobel 边缘检测与骨架细化现可在全部 CPU 核心上并行执行。
                多百万像素照片的单图处理在一台 24 核机器上从约 1.4s 降到约 0.5s。
              </li><li>
                <strong>并行视频帧：</strong><code>video</code> 子命令现在并发处理多帧而非逐帧串行——
                同机测试中一段 10 秒/301 帧 1080p 视频从 22.4s 缩短到 4.5s（提速 4.98 倍）。
              </li></ul>'''
