# ── changelog.*
changelog_20260824_title = "[2026-08-24] - Now in Chinese + Reveal polish"
changelog_20260824_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>Simplified Chinese is live:</strong> the whole site is now bilingual. Mainland visitors are auto-directed to the
                <code>/zh/</code> edition, an <code>EN | 中文</code> switcher sits on every page, and CJK text renders in a crisp 12px pixel font served
                from our CDN.
              </li><li style="margin-bottom: 5px;">
                <strong>Reveal feels right:</strong> animations now honor your <code>Stroke Weight</code> from start to finish, staged
                <code>Mono first, color spreads</code> ends exactly on its final frame (no more sudden color shift at completion), and heavy
                10,000+-path artwork plays smoothly thanks to a new dirty-rect compositor and batched stroke rendering.
              </li><li><strong>Always fresh:</strong> assets are content-hashed, so updates reach your browser without manual hard refreshes.</li></ul>'''
changelog_20260823_title = "[2026-08-23] - Progressive Reveal comes to Vectomancy Pro"
changelog_20260823_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>Delayed rendering is here:</strong> artwork no longer has to appear all at once. Open the <a href="/image/">Image</a> or
                <a href="/typography/">Text</a> tool and look for the new <code>Reveal</code> panel in the left sidebar.
              </li><li style="margin-bottom: 5px;">
                <strong>Pick an animation:</strong> directional sweeps (L→R, R→L, T→B, B→T), diagonals (TL→BR / BR→TL), radial expansion from the center,
                stroke-by-stroke <code>Sequential Draw</code>, or <code>Random Scatter</code>. Set the <code>Duration</code> slider and press
                <code>REPLAY</code> to watch it again.
              </li><li style="margin-bottom: 5px;">
                <strong>Custom radial origin:</strong> hold <code>ALT</code> and click anywhere on the canvas — the reveal blooms outward from exactly that
                point.
              </li><li style="margin-bottom: 5px;">
                <strong>Staged color:</strong> tick <code>Mono first, color spreads</code> to draw the whole piece in monochrome first, then let the real colors
                bloom back in with their own strategy (<code>Color Spread</code>) and timing (<code>Color Lag</code>). Especially striking with colorful line
                art and gradients!
              </li><li><strong>Stability fix:</strong> repaired a long-standing script error that could silently break the whole Playground page.</li></ul>'''
changelog_20260819_title = "[v8.1.0] - 2026-08-19"
changelog_20260819_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>Compact HTML &amp; Desmos equations:</strong> zero terms, identity multipliers and redundant signs are removed, while malformed
                concatenated Spline terms are now emitted as valid expressions.
              </li><li style="margin-bottom: 5px;">
                <strong>Correct domains and framing:</strong> Spline exports use their actual parameter intervals and endpoints; Desmos and SVG initialize from
                the source bounding box instead of assuming zero-based coordinates.
              </li><li>
                <strong>Safer JSON &amp; SVG rendering:</strong> invalid non-finite AST values are rejected, and SVG Fourier sampling adapts to active
                high-frequency terms to prevent aliased or collapsed paths.
              </li></ul>'''
changelog_20260816_title = "[2026-08-16] - Video &amp; JSON Studio moved to CLI"
changelog_20260816_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>Video and JSON Studio web pages removed:</strong> to keep the site lightweight, these two tools are no longer available in the browser.
                Both features remain fully available in the CLI — run <code>vectomancy video input.mp4 -o output.mp4</code> for video, and
                <code>vectomancy render output.json -f svg -o out.svg</code> to re-render an exported JSON locally in your terminal.
              </li></ul>'''
changelog_20260814_title = "[v8.0.0] - 2026-08-14"
changelog_20260814_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>CLI v2.0.0 Released:</strong> Core <code>vectomancy</code> CLI updated to v2.0.0 with critical SVG export and JSON rendering fixes.
              </li><li style="margin-bottom: 5px;">
                <strong>SVG stroke-width fix (#132):</strong> <code>vectomancy image -f svg --stroke-width X</code> was silently ignoring <code>X</code> — all
                SVG <code>&lt;path&gt;</code> elements had a hardcoded <code>stroke-width="1"</code>. Now correctly threads the value through the entire emitter
                pipeline (<code>emit_file</code> → <code>to_svg_string</code>).
              </li><li>
                <strong>New <code>render</code> subcommand (#133):</strong> Load a previously exported JSON and re-render without re-running the analysis
                pipeline. Supports all output formats (<code>svg</code>, <code>png</code>, <code>jpg</code>, <code>webp</code>, <code>python</code>,
                <code>html</code>, <code>desmos</code>). Example:
                <code>vectomancy render output.json -f svg --stroke-width 0.005 -o thin.svg</code>
              </li></ul>'''
changelog_20260813_v715_title = "[v7.1.5] - 2026-08-13"
changelog_20260813_v715_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>JSON Studio:</strong> New dedicated page at <code>/json-studio</code> — load an exported JSON AST, then freely adjust stroke weight,
                color, background and output size with instant re-render, zero WASM overhead.
              </li><li style="margin-bottom: 5px;">
                <strong>Stroke Weight expanded (0.001 – 100 px):</strong> All three tools (Image, Text, Video) now accept values down to 0.001 px. At such thin
                strokes the output is invisible to the human eye yet remains fully decodable by multimodal LLMs via the raw PNG pixel values.
              </li><li style="margin-bottom: 5px;"><strong>COPY button:</strong> One-click PNG copy to clipboard on the Image and Text pages.</li><li style="margin-bottom: 5px;">
                <strong>RESTORE FROM JSON:</strong> Load a previously exported JSON file directly into the Image or Text gallery to re-render with different
                visual parameters.
              </li><li style="margin-bottom: 5px;">
                <strong>Video stroke fix:</strong> Video page now has a Stroke Weight input; <code>vectomancy video --stroke-width</code> also wired to frame
                exports.
              </li><li>
                <strong>Typography stroke fix:</strong> The <code>drawCachedPaths()</code> renderer was ignoring the Stroke Weight input. Now correctly reads
                the user-supplied value.
              </li></ul>'''
changelog_20260813_maintenance_title = "[2026-08-13] - Maintenance &amp; UX"
changelog_20260813_maintenance_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>SVG Export Coordinates Fixed:</strong> Exported images no longer appear only in the top-left corner &mdash; the engine now correctly
                maps the SVG viewBox into the output canvas, honouring <code>preserveAspectRatio</code> (xMidYMid meet).
              </li><li style="margin-bottom: 5px;">
                <strong>Dependency Upgrade:</strong> Upgraded to <code>usvg 0.48</code> and <code>kiddo 6</code>, bringing the latest SVG parser improvements
                and faster nearest-neighbour queries for the TSP routing pass.
              </li><li style="margin-bottom: 5px;">
                <strong>Stroke Weight default 2.0px:</strong> The default stroke width is now 2.0 px (was 1.0 px) across the CLI and both web tools for better
                out-of-the-box output quality.
              </li><li>
                <strong>Stroke Weight input:</strong> The Stroke Weight control is now a number input instead of a slider &mdash; type any value from 0.01 to
                5.00 without accidental redraws on drag.
              </li></ul>'''
changelog_20260731_title = "[v7.1.3] - 2026-07-31"
changelog_20260731_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>Skeleton Extraction Quality:</strong> The raster pipeline now runs full Zhang-Suen thinning with endpoint/loop-aware path tracing,
                matching the reference parser &mdash; previously a simplified greedy walk produced fragmented, noisy skeletons that stopped at the first branch
                point.
              </li><li>
                <strong>Release Pipeline Hardening:</strong> All workspace crate manifests now bump in lockstep, and the release workflow fails fast on
                manifest/tag version mismatch before publishing anything.
              </li></ul>'''
changelog_20260729_title = "[v7.1.0] - 2026-07-29"
changelog_20260729_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>Workspace Crate Decoupling:</strong> The engine is split into six standalone publishable crates &mdash;
                <code>vectomancy-geometry</code>, <code>vectomancy-transform</code>, <code>vectomancy-raster</code>, <code>vectomancy-svg</code>,
                <code>vectomancy-export</code>, <code>vectomancy-pipeline</code> &mdash; each independently versioned and tested, with the facade preserving
                drop-in compatibility.
              </li></ul>'''
changelog_20260724_v700_title = "[v7.0.0] - 2026-07-24"
changelog_20260724_v700_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>Multi-Core Raster Pipeline:</strong> Sobel edge detection and skeleton thinning now run in parallel across all CPU cores. Single-image
                processing on a multi-megapixel photo dropped from ~1.4s to ~0.5s on a 24-core machine.
              </li><li>
                <strong>Parallel Video Frames:</strong> The <code>video</code> subcommand now processes multiple frames concurrently instead of one at a time
                &mdash; a 10s/301-frame 1080p clip went from 22.4s to 4.5s (4.98x faster) on the same machine.
              </li></ul>'''
changelog_20260724_v630_title = "[v6.3.0] - 2026-07-24"
changelog_20260724_v630_body = '''
<ul style="margin: 0; padding-left: 20px; list-style-type: square;"><li style="margin-bottom: 5px;">
                <strong>SVG Export:</strong> New vector export option for the Image Engine. Flattens Spline, Fourier, and Chaikin curves into a clean, scalable
                SVG document with full color and gradient support.
              </li><li>
                <strong>CLI Parity:</strong> The core <code>vectomancy</code> CLI (v6.3.0) now also supports <code>--format svg</code> for the
                <code>image</code>, <code>video</code>, and <code>text</code> subcommands.
              </li></ul>'''

