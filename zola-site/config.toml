app_help_reveal_body = "- <b>扫掠</b>：笔画沿指定方向依次出现（左右、上下、对角）。<br />- <b>径向</b>：从中心或自定义起点向外扩张。<br />- <b>顺序 / 随机</b>：逐笔绘制的顺序，固定或打乱。<br />- <b>先黑白</b>：画面先以单色出现，随后色彩按独立策略与延迟蔓延铺开。<br />- <b>ALT+点击</b> 画布即可设置径向起点。"
app_help_tips_head = "进阶提示："
app_help_tips_body = "- <b>剪贴板</b>：可直接在任何位置粘贴（Ctrl+V）图片！<br />- <b>专注模式（F）</b>：隐藏界面，纯粹欣赏。<br />- <b>透明背景</b>：在设置中开关。启用后会禁用 JPG 导出。<br />- <b>快捷操作</b>：滚轮缩放，拖拽平移。"
