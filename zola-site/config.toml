# The URL the site will be built for
base_url = "https://vectomancy.xuepoo.xyz"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

# SEO configuration
generate_sitemap = true
generate_robots_txt = true

# ── i18n ─────────────────────────────────────────────────────────────────────
# i18n key convention: <scope>_<name> snake_case; scopes: nav, footer, common,
# home, image, typo, app, gallery, base, meta, changelog_<YYYYMMDD>_title/_body
#
# Rules for future agents/languages:
#   - Every language (including the default) declares a [languages.<code>]
#     block; its strings live in [languages.<code>.translations].
#   - Every key present in the default language MUST also exist in every other
#     language table — missing keys fail the Zola build.
#   - Templates read strings via {{ trans(key="scope_name") }}; JS reads them
#     via window.t8(en, zh).
default_language = "en"

[languages.en]

