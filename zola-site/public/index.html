    <style>
        :root {
            --bg-color: #f7f7f7;
            --text-color: #212529;
            --container-bg: #fff;
        }
        body.dark-theme {
            --bg-color: #1a1a1a;
            --text-color: #d3d3d3;
            --container-bg: #212529;
        }
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            margin-top: 50px;
            margin-bottom: 50px;
            text-align: center;
        }
        .logo-img {
            width: 64px;
            height: 64px;
            image-rendering: pixelated;
            margin-bottom: 20px;
        }
        footer {
            margin-top: 80px;
            text-align: center;
            font-size: 10px;
            color: #888;
        }
        a {
            color: #209cee;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>

<style>
    .marquee-container {
        width: 100vw;
        position: relative;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
        overflow: hidden;
        white-space: nowrap;
        box-sizing: border-box;
        margin-top: 60px;
        padding: 30px 0;
        border-top: 4px solid var(--text-color);
        border-bottom: 4px solid var(--text-color);
        background: var(--container-bg);
    }
    .marquee-content {
        display: inline-block;
        animation: marquee 30s linear infinite;
    }
    .marquee-content img {
        height: 250px;
        margin-right: 30px;
        border: 4px solid var(--text-color);
        image-rendering: auto;
        object-fit: contain;
        background: #fff;
    }
    body.dark-theme .marquee-content img { background: #333; }

    @keyframes marquee {
        0%   { transform: translate(0, 0); }
        100% { transform: translate(-50%, 0); }
    }
</style>

</head>
<body>

<div class="container" style="max-width: 1200px;">
    <header>
        <img src="/img/logo.svg" alt="Vectomancy Logo" class="logo-img" style="width: 96px; height: 96px;">
        <h1 style="margin-bottom: 20px;">VECTOMANCY</h1>
        <p style="line-height: 1.8; font-size: 14px;">Transform images into pure mathematical equations and curves.</p>

        <div style="margin-top: 40px; display: flex; justify-content: center; gap: 20px;">
            <a href="/app" class="nes-btn is-primary">Launch Playground</a>
            <a href="https://github.com/Xuepoo/vectomancy" target="_blank" class="nes-btn"><i class="nes-icon github"></i> GitHub</a>
        </div>
    </header>
</div>

<!-- Full width gallery -->
<div class="marquee-container">
    <div class="marquee-content">

        <img src="https://dns.xuepoo.xyz/examples/01.jpg" alt="Preview">
        <img src="https://dns.xuepoo.xyz/examples/fuji.png" alt="Preview">
        <img src="https://dns.xuepoo.xyz/examples/hatsune_miku.jpg" alt="Preview">

        <img src="https://dns.xuepoo.xyz/examples/04.jpg" alt="Preview">
        <!-- Duplicated set for infinite seamless scroll -->
        <img src="https://dns.xuepoo.xyz/examples/01.jpg" alt="Preview">
        <img src="https://dns.xuepoo.xyz/examples/fuji.png" alt="Preview">
        <img src="https://dns.xuepoo.xyz/examples/hatsune_miku.jpg" alt="Preview">
        <img src="https://dns.xuepoo.xyz/examples/十角馆事件.jpg" alt="Preview">
        <img src="https://dns.xuepoo.xyz/examples/04.jpg" alt="Preview">
    </div>
</div>

<div class="container" style="max-width: 1200px;">
    <footer>
