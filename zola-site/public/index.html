        :root {
            --bg-color: #f7f7f7;

            --container-bg: #fff;

        }
        body.dark-theme {

        }

            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 980px;

            padding: 20px;

        }

            width: 64px;

            image-rendering: pixelated;

        }
        footer {

            text-align: center;

            color: var(--footer-text);

        a {

        a:hover {

<style>
    .marquee-container {
        width: 100vw;
        position: relative;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
        overflow: hidden;
        white-space: nowrap;
        box-sizing: border-box;
        margin-top: 30px;
        padding: 15px 0;
        border-top: 4px solid var(--text-color);
        border-bottom: 4px solid var(--text-color);
        background: var(--container-bg);
    }
    .marquee-content {
        display: inline-block;
        animation: marquee 30s linear infinite;
    }
    .marquee-content img {
        height: 380px;
        margin-right: 30px;
        border: 4px solid var(--text-color);
        image-rendering: auto;
        object-fit: contain;
        background: #fff;
    }
    body.dark-theme .marquee-content img { background: #333; }

    @keyframes marquee {
        0%   { transform: translate(0, 0); }
        100% { transform: translate(-50%, 0); }
    }

    /* Sticky footer styling */
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }
    body {
        display: flex;
        flex-direction: column;
    }
    .main-content-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
        .marquee-content img {
            height: 200px;
            margin-right: 15px;
            border-width: 2px;
        }
        .marquee-container {

        header h1 {

        header img.logo-img {

</style>

<script>
    // System dark theme detection and localStorage persistence for the landing page
    const stored = localStorage.getItem('vectomancy_user_settings');
    let useDark = false;
    if (stored) {
        try {
            const settings = JSON.parse(stored);
            if (settings.theme === 'dark') useDark = true;
            else if (settings.theme === 'light') useDark = false;
        } catch(e) {}
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        useDark = true;
    }

    if (useDark) {
        document.body.classList.add('dark-theme');
    }
</script>

</body>
