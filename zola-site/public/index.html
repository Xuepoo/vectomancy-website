    <script>
        (function() {
            const sharedTheme = localStorage.getItem('vectomancy_theme');
            let useDark = false;
            if (sharedTheme) {
                useDark = (sharedTheme === 'dark');
            } else {
                const stored = localStorage.getItem('vectomancy_user_settings');
                if (stored) {
                    try {
                        const settings = JSON.parse(stored);
                        useDark = (settings.theme === 'dark');
                    } catch(e) {}
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    useDark = true;
                }
            }
            if (useDark) {
                document.body.classList.add('dark-theme');
            }
        })();
    </script>

    // System dark theme detection and localStorage persistence for the landing page
    let useDark = false;
    const sharedTheme = localStorage.getItem('vectomancy_theme');
    if (sharedTheme) {
        useDark = (sharedTheme === 'dark');
    } else {
        const stored = localStorage.getItem('vectomancy_user_settings');
        if (stored) {
            try {
                const settings = JSON.parse(stored);
                if (settings.theme === 'dark') useDark = true;
                else if (settings.theme === 'light') useDark = false;
            } catch(e) {}
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            useDark = true;
        }
    }

    if (useDark) {
        document.body.classList.add('dark-theme');
    }

    const themeBtn = document.getElementById('themeToggleBtn');
    if (themeBtn) {
        themeBtn.addEventListener('click', () => {
            const isDark = document.body.classList.toggle('dark-theme');
            try {
                const themeStr = isDark ? 'dark' : 'light';
                localStorage.setItem('vectomancy_theme', themeStr);
                localStorage.setItem('vectomancy_user_settings', JSON.stringify({
                    theme: themeStr
                }));
            } catch(e) {}
        });
    }
</script>


    <!-- Retro Feedback UI -->
    <button type="button" class="nes-btn is-primary" id="btn-open-feedback" style="position: fixed; bottom: 30px; right: 30px; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        <i class="nes-icon is-small heart"></i> Feedback
    </button>

    <dialog class="nes-dialog" id="dialog-feedback">
      <form method="dialog">
        <p class="title">Send Feedback</p>
        <div class="nes-field">
          <textarea id="feedback_textarea" class="nes-textarea" placeholder="Found a bug or have an idea?" style="min-height: 120px; font-family: inherit; font-size: 12px;"></textarea>
        </div>
        <menu class="dialog-menu" style="margin-top: 20px; display: flex; justify-content: space-between;">
          <button class="nes-btn">Cancel</button>
          <button class="nes-btn is-success" id="btn-submit-feedback" type="button">Submit</button>
        </menu>
      </form>
    </dialog>

    <!-- Custom Styled Alert Dialog -->
    <dialog class="nes-dialog is-rounded" id="custom-alert-dialog" style="z-index: 10000; font-family: 'Press Start 2P', cursive; font-size: 10px; max-width: 450px; text-align: left;">
      <form method="dialog">
        <p class="title" style="font-size: 10px; margin-bottom: 15px; color: var(--text-color);">NOTIFICATION</p>
        <p id="custom-alert-message" style="font-size: 8px; line-height: 1.6; margin-bottom: 25px; word-break: break-word;"></p>
        <menu class="dialog-menu" style="display: flex; justify-content: flex-end; padding: 0; margin: 0;">
          <button class="nes-btn is-primary" style="font-size: 8px; padding: 4px 12px;">OK</button>
        </menu>
      </form>
    </dialog>

    <!-- Custom Styled Confirm Dialog -->
    <dialog class="nes-dialog is-rounded" id="custom-confirm-dialog" style="z-index: 10000; font-family: 'Press Start 2P', cursive; font-size: 10px; max-width: 450px; text-align: left;">
      <form method="dialog">
        <p class="title" style="font-size: 10px; margin-bottom: 15px; color: var(--text-color);">CONFIRM</p>
        <p id="custom-confirm-message" style="font-size: 8px; line-height: 1.6; margin-bottom: 25px; word-break: break-word;"></p>
        <menu class="dialog-menu" style="display: flex; justify-content: space-between; padding: 0; margin: 0;">
          <button class="nes-btn" id="custom-confirm-cancel" type="button" style="font-size: 8px; padding: 4px 12px;">CANCEL</button>
          <button class="nes-btn is-success" id="custom-confirm-ok" type="button" style="font-size: 8px; padding: 4px 12px;">OK</button>
        </menu>
      </form>
    </dialog>

    <script>
      // Global custom alert overlay (replaces default browser alert)
      const nativeAlert = window.alert;
      window.alert = function(message) {
          const dialog = document.getElementById('custom-alert-dialog');
          if (!dialog) {
              nativeAlert(message);
              return;
          }
          const msgEl = document.getElementById('custom-alert-message');
          msgEl.innerText = message;
          dialog.showModal();
      };

      // Custom async confirm dialog (must be awaited)
      window.showCustomConfirm = function(message) {
          return new Promise((resolve) => {
              const dialog = document.getElementById('custom-confirm-dialog');
              if (!dialog) {
                  resolve(window.confirm(message));
                  return;
              }
              const msgEl = document.getElementById('custom-confirm-message');
              const okBtn = document.getElementById('custom-confirm-ok');
              const cancelBtn = document.getElementById('custom-confirm-cancel');

              msgEl.innerText = message;

              const cleanup = () => {
                  okBtn.onclick = null;
                  cancelBtn.onclick = null;
                  dialog.removeEventListener('close', onClose);
              };

              const onClose = () => {
                  cleanup();
                  resolve(false);
              };

              const onOk = () => {
                  cleanup();
                  dialog.close();
                  resolve(true);
              };

              const onCancel = () => {
                  cleanup();
                  dialog.close();
                  resolve(false);
              };

              okBtn.onclick = onOk;
              cancelBtn.onclick = onCancel;
              dialog.addEventListener('close', onClose);
              dialog.showModal();
          });
      };

      document.getElementById('btn-open-feedback').addEventListener('click', function() {
          document.getElementById('dialog-feedback').showModal();
      });

      document.getElementById('btn-submit-feedback').addEventListener('click', async function() {
          const textarea = document.getElementById('feedback_textarea');
          const text = textarea.value.trim();
          if (!text) return;

          const btn = this;
          btn.innerText = "Sending...";
          btn.classList.add('is-disabled');

          try {
              const res = await fetch('/api/feedback', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ message: text })
              });
              if (res.ok) {
                  textarea.value = '';
                  document.getElementById('dialog-feedback').close();
                  alert("Thanks for your feedback! The developer will check it soon.");
              } else {
                  alert("Failed to send feedback.");
              }
          } catch (e) {
              alert("Network error.");
          } finally {
              btn.innerText = "Submit";
              btn.classList.remove('is-disabled');
          }
      });
    </script>
</body>
</html>
