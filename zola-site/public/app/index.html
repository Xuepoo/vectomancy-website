<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vectomancy Pro - Retro Lab</title>

    <!-- Meta tags for SEO & OG -->
    <meta name="description" content="Convert raster images into mathematical vectors using Fourier series and Zhang-Suen thinning.">
    <meta name="keywords" content="Image to parametric equation converter online, Fourier series vector animation generator, Online Zhang-Suen thinning tool, Raster to SVG math art, Vectomancy">
    <meta property="og:title" content="Vectomancy - Image to Parametric Equation Converter">
    <meta property="og:description" content="Convert raster images into mathematical vectors using Fourier series and Zhang-Suen thinning.">
    <meta property="og:image" content="https://vectomancy.xuepoo.xyz/examples/fuji.png">
    <meta name="twitter:card" content="summary_large_image">

    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
    <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
    <style>
        :root {
            --bg-color: #f7f7f7;
            --text-color: #212529;
            --grid-color: #ddd;
            --container-bg: #fff;
            --accent-color: #209cee;
        }

        body.dark-theme {
            --bg-color: #1a1a1a;
            --text-color: #d3d3d3;
            --grid-color: #333;
            --container-bg: #212529;
            --accent-color: #92cc41;
        }

        body, input, select, textarea, button, option {
            font-family: 'Press Start 2P', cursive !important;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-size: 8px; /* Reduced base font size to fit more content */
        }

        /* Dark Theme Overrides for NES.css */
        body.dark-theme .nes-container {
            background-color: var(--container-bg);
            color: var(--text-color);
            border-image-slice: 2;
            border-image-width: 2;
            border-image-repeat: stretch;
            border-image-source: url('data:image/svg+xml;utf8,<?xml version="1.0" encoding="UTF-8" ?><svg version="1.1" width="5" height="5" xmlns="http://www.w3.org/2000/svg"><path d="M2 1 h1 v1 h-1 z M1 2 h1 v1 h-1 z M3 2 h1 v1 h-1 z M2 3 h1 v1 h-1 z" fill="rgb(211,211,211)" /></svg>');
            border-image-outset: 2;
        }
        body.dark-theme .nes-container.with-title > .title {
            background-color: var(--container-bg);
            color: var(--text-color);
        }
        body.dark-theme .nes-input, body.dark-theme .nes-select select, body.dark-theme .nes-textarea {
            background-color: #111;
            color: #fff;
        }
        body.dark-theme .nes-text.is-primary { color: #92cc41; }

        /* Layout */
        .sidebar {
            width: 340px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
            border-right: 4px solid var(--text-color);
            background-color: var(--container-bg);
            z-index: 10;
        }

        .viewport-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .top-bar {
            position: absolute;
            top: 10px;
            right: 10px; /* Moved to top right */
            z-index: 100;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .canvas-area {
            flex-grow: 1;
            overflow: hidden;
            position: relative;
            background-color: var(--bg-color);
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
            linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            cursor: grab;
        }
        .canvas-area:active { cursor: grabbing; }

        #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }

        .gallery-container {
            height: 120px; /* Reduced height to prevent scroll */
            background-color: var(--container-bg);
            border-top: 4px solid var(--text-color);
            padding: 10px;
            display: flex;
            gap: 15px;
            overflow-x: auto;
            align-items: center;
            z-index: 10;
        }

        .gallery-item {
            width: 80px; /* Smaller items */
            height: 80px;
            flex-shrink: 0;
            border: 4px solid transparent;
            cursor: pointer;
            position: relative;
            background: #fff;
            image-rendering: pixelated;
        }
        body.dark-theme .gallery-item { background: #333; }
        .gallery-item:hover { border-color: #888; }
        .gallery-item.active { border-color: var(--accent-color); }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Custom Delete Button matching NES style */
        .gallery-delete {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #e76e55;
            color: #fff;
            border: 2px solid #000;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            cursor: pointer;
            z-index: 10;
        }
        body.dark-theme .gallery-delete { border-color: #fff; }
        .gallery-delete:hover { background: #ce372b; }

        .gallery-label {
            position: absolute;
            bottom: -15px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .control-group { margin-bottom: 10px; } /* Tighter margins */
        .control-group label { margin-bottom: 2px; display: block; font-size: 8px; }

        input[type=range] { width: 100%; }

        .hidden { display: none !important; }

        #status-text { margin-top: 5px; font-size: 8px; color: var(--accent-color); text-align: center;}

        /* Floating Stats */
        .overlay-stats {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px;
            border: 2px solid #fff;
            pointer-events: none;
            line-height: 1.5;
            font-size: 8px;
        }

        /* Progress Bar Overlay */
        .progress-overlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: var(--container-bg);
            border: 4px solid var(--text-color);
            padding: 10px;
            width: 300px;
            z-index: 50;
        }

        /* Loading Spinner Overlay */
        .loader-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            color: white;
            backdrop-filter: blur(2px);
        }
        .pixel-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #fff;
            border-top: 4px solid var(--accent-color);
            animation: spin 1s steps(8) infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Dialog specific styling */
        dialog { font-family: 'Press Start 2P', cursive; }
        dialog::backdrop { background: rgba(0,0,0,0.6); }

        /* Tighter NES inputs */
        .nes-btn { padding: 4px 8px; font-size: 8px;}
        .nes-input, .nes-select select { padding: 4px; font-size: 8px; height: auto;}

        /* Radio toggle for input type */
        .input-toggle { display: flex; gap: 10px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <!-- SIDEBAR CONTROLS -->
    <div class="sidebar">
        <div class="nes-container with-title is-centered" style="margin-bottom: 10px; padding: 10px;">
            <p class="title" style="display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 10px;">
                <img src="/img/logo.svg" alt="logo" style="width: 20px; height: 20px;">
                VECTOMANCY
            </p>
            <p style="font-size: 7px; margin:0;">Pixel Math Engine</p>
        </div>

        <div class="nes-container with-title is-dark control-group" style="margin-bottom: 10px; padding: 10px;">
            <p class="title" style="font-size: 8px;">I/O</p>
            <div class="input-toggle" style="font-size: 7px;">
                <label>
                    <input type="radio" class="nes-radio" name="inputType" value="local" checked>
                    <span>Local</span>
                </label>
                <label>
                    <input type="radio" class="nes-radio" name="inputType" value="url">
                    <span>URL</span>
                </label>
            </div>

            <div id="localInputWrapper" title="Supports PNG, JPG, JPEG, SVG">
                <label class="nes-btn" style="width: 100%; display: block; text-align: center;">
                    <span>Select Image</span>
                    <input type="file" id="fileInput" accept="image/*,.svg" style="display:none;">
                </label>
            </div>

            <div id="urlInputWrapper" class="hidden">
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="urlInput" class="nes-input" placeholder="https://...">
                    <button id="fetchUrlBtn" class="nes-btn is-primary">GO</button>
                </div>
            </div>

            <p id="filename-display" style="margin-top:5px; font-size: 7px; word-break: break-all; text-align: center;">No file selected</p>
        </div>

        <div class="nes-container with-title control-group" style="margin-bottom: 10px; padding: 10px;">
            <p class="title" style="font-size: 8px;">Examples</p>
            <div style="display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px;">
                <img src="https://dns.xuepoo.xyz/examples/01.jpg" class="preset-example" data-filename="01.jpg" alt="Ex 1" style="width: 32px; height: 32px; cursor: pointer; border: 2px solid var(--text-color); object-fit: cover;">
                <img src="https://dns.xuepoo.xyz/examples/fuji.png" class="preset-example" data-filename="fuji.png" alt="Fuji" style="width: 32px; height: 32px; cursor: pointer; border: 2px solid var(--text-color); object-fit: cover;">
                <img src="https://dns.xuepoo.xyz/examples/hatsune_miku.jpg" class="preset-example" data-filename="miku.jpg" alt="Miku" style="width: 32px; height: 32px; cursor: pointer; border: 2px solid var(--text-color); object-fit: cover;">
                <img src="https://dns.xuepoo.xyz/examples/十角馆事件.jpg" class="preset-example" data-filename="book.jpg" alt="Book" style="width: 32px; height: 32px; cursor: pointer; border: 2px solid var(--text-color); object-fit: cover;">
            </div>
        </div>

        <div class="nes-container with-title control-group" style="padding: 10px; flex-grow: 1; overflow-y: auto;">
            <p class="title" style="font-size: 8px;">Settings</p>

            <label for="modeSelect">Mode</label>
            <div class="nes-select" style="margin-bottom: 5px;">
                <select required id="modeSelect">
                    <option value="spline" selected>Spline</option>
                    <option value="fourier">Fourier</option>
                    <option value="chaikin">Chaikin</option>
                </select>
            </div>

            <label style="display:flex; align-items:center; margin-bottom: 5px;">
                <input type="checkbox" class="nes-checkbox" id="colorCheck" checked style="transform: scale(0.7); margin-right: 5px;"/>
                <span>Colors</span>
            </label>

            <label>Detail: <span id="detailVal">50</span></label>
            <input type="range" id="detailRange" min="1" max="100" value="50">

            <label style="margin-top: 5px;">Min Path: <span id="minPathVal">10</span></label>
            <input type="range" id="minPathRange" min="2" max="50" value="10">

            <div id="fourier-controls" class="hidden" style="margin-top: 5px;">
                <label>Terms: <span id="termsVal">1000</span></label>
                <input type="range" id="termsRange" min="10" max="5000" step="10" value="1000">
            </div>

            <div id="chaikin-controls" class="hidden" style="margin-top: 5px;">
                <label>Iters: <span id="chaikinVal">1</span></label>
                <input type="range" id="chaikinRange" min="0" max="5" value="1">
            </div>

            <button type="button" class="nes-btn is-primary" id="generateBtn" style="width: 100%; margin-top: 10px;">GENERATE</button>
            <div id="status-text">INIT WASM...</div>
        </div>

        <!-- EXPORT SECTION -->
        <div class="nes-container with-title control-group" style="margin-bottom: 10px; padding: 10px;">
            <p class="title" style="font-size: 8px;">Export</p>
            <div style="display: flex; gap: 5px;">
                <div class="nes-select" style="flex-grow: 1;">
                    <select required id="exportFormat">
                        <option value="png" selected>PNG</option>
                        <option value="jpg">JPG</option>
                        <option value="json">JSON</option>
                    </select>
                </div>
                <label style="display:flex; align-items:center;">
                    <input type="checkbox" class="nes-checkbox" id="bgTransparentCheck" style="transform: scale(0.7);" />
                    <span style="font-size:6px;">Transp</span>
                </label>
            </div>
            <button type="button" class="nes-btn is-success" id="downloadBtn" style="width: 100%; margin-top: 5px;">DOWNLOAD</button>
        </div>

        <div class="nes-container is-dark" style="margin-top: auto; padding: 5px; text-align: center;">
            <a href="https://github.com/Xuepoo/vectomancy" target="_blank" class="nes-btn is-warning" style="width: 100%; font-size: 6px; margin-bottom: 5px; padding: 4px;">GitHub</a>
            <p style="font-size: 6px; color: #888; margin:0;">Rust • WASM • Zola</p>
        </div>
    </div>

    <!-- MAIN VIEWPORT & GALLERY -->
    <div class="viewport-wrapper">
        <div class="top-bar">
            <button type="button" class="nes-btn" id="themeToggleBtn">Theme</button>
            <button type="button" class="nes-btn" id="resetViewBtn">Reset</button>
        </div>

        <div class="canvas-area" id="canvasArea">
            <canvas id="mainCanvas"></canvas>

            <div class="overlay-stats nes-container is-rounded" id="overlayStats">
                Waiting...
            </div>

            <!-- Progress Bar -->
            <div id="progressContainer" class="progress-overlay hidden">
                <p style="margin: 0 0 5px 0; font-size: 8px;" id="progressText">Computing...</p>
                <progress class="nes-progress is-primary" value="0" max="100" id="progressBar"></progress>
            </div>
        </div>

        <div class="gallery-container" id="gallery">
            <!-- Snapshots / Original go here -->
        </div>

        <!-- Loading Spinner -->
        <div id="loaderOverlay" class="loader-overlay">
            <div class="pixel-spinner"></div>
            <p style="margin-top: 15px;" id="loaderText">Loading Engine...</p>
        </div>
    </div>

    <!-- Custom NES Dialog for Deletion -->
    <dialog class="nes-dialog" id="delete-dialog" style="border: 4px solid var(--text-color);">
        <form method="dialog">
            <p class="title" style="margin-bottom: 10px;">Confirm Deletion</p>
            <p style="font-size: 10px; margin-bottom: 20px;">Erase this snapshot from memory?</p>
            <menu class="dialog-menu" style="display: flex; gap: 10px; justify-content: flex-end; padding: 0; margin: 0;">
                <button class="nes-btn" value="cancel">Cancel</button>
                <button class="nes-btn is-error" id="confirmDeleteBtn" value="confirm">Delete</button>
            </menu>
        </form>
    </dialog>

    <script type="module">
        import init, { process_image } from '/wasm/wasm_engine.js';

        // --- State ---
        let isWasmLoaded = false;
        let currentImageBytes = null;
        let currentFilename = "";
        let originalImageObj = null;
        let snapshotCount = 0;
        let pendingDeleteId = null;

        const previewDataStore = new Map();
        let activePreviewId = null;

        // --- Pan/Zoom State ---
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let renderRequested = false;

        // --- DOM Elements ---
        const els = {
            radioLocal: document.querySelector('input[value="local"]'),
            radioUrl: document.querySelector('input[value="url"]'),
            localWrapper: document.getElementById('localInputWrapper'),
            urlWrapper: document.getElementById('urlInputWrapper'),
            urlInput: document.getElementById('urlInput'),
            fetchUrlBtn: document.getElementById('fetchUrlBtn'),
            fileInput: document.getElementById('fileInput'),
            filenameDisplay: document.getElementById('filename-display'),
            modeSelect: document.getElementById('modeSelect'),
            colorCheck: document.getElementById('colorCheck'),
            detailRange: document.getElementById('detailRange'),
            minPathRange: document.getElementById('minPathRange'),
            termsRange: document.getElementById('termsRange'),
            chaikinRange: document.getElementById('chaikinRange'),
            fourierControls: document.getElementById('fourier-controls'),
            chaikinControls: document.getElementById('chaikin-controls'),
            generateBtn: document.getElementById('generateBtn'),
            statusText: document.getElementById('status-text'),
            themeToggleBtn: document.getElementById('themeToggleBtn'),
            resetViewBtn: document.getElementById('resetViewBtn'),
            canvasArea: document.getElementById('canvasArea'),
            mainCanvas: document.getElementById('mainCanvas'),
            gallery: document.getElementById('gallery'),
            overlayStats: document.getElementById('overlayStats'),
            exportFormat: document.getElementById('exportFormat'),
            bgTransparentCheck: document.getElementById('bgTransparentCheck'),
            downloadBtn: document.getElementById('downloadBtn'),
            loaderOverlay: document.getElementById('loaderOverlay'),
            loaderText: document.getElementById('loaderText'),
            progressContainer: document.getElementById('progressContainer'),
            progressBar: document.getElementById('progressBar'),
            deleteDialog: document.getElementById('delete-dialog'),
            confirmDeleteBtn: document.getElementById('confirmDeleteBtn')
        };

        const ctx = els.mainCanvas.getContext('2d');

        function truncateMiddle(str, maxLength) {
            if (str.length <= maxLength) return str;
            const front = Math.ceil((maxLength - 3) / 2);
            const back = Math.floor((maxLength - 3) / 2);
            return str.substr(0, front) + '...' + str.substr(str.length - back);
        }

        // --- Initialization ---
        async function run() {
            try {
                await init();
                isWasmLoaded = true;
                els.statusText.innerText = "READY. INSERT COIN";
                els.loaderOverlay.classList.add('hidden');
            } catch (e) {
                els.statusText.innerText = "ERR: WASM CRASH";
                els.loaderText.innerText = "CRITICAL ERROR";
            }

            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.body.classList.add('dark-theme');
                els.deleteDialog.classList.add('is-dark');
            }
        }

        // --- UI Updates ---
        function updateLabels() {
            document.getElementById('detailVal').innerText = els.detailRange.value;
            document.getElementById('minPathVal').innerText = els.minPathRange.value;
            document.getElementById('termsVal').innerText = els.termsRange.value;
            document.getElementById('chaikinVal').innerText = els.chaikinRange.value;

            const mode = els.modeSelect.value;
            els.fourierControls.classList.toggle('hidden', mode !== 'fourier');
            els.chaikinControls.classList.toggle('hidden', mode !== 'chaikin');
        }

        [els.detailRange, els.minPathRange, els.termsRange, els.chaikinRange, els.modeSelect].forEach(el => {
            el.addEventListener('input', updateLabels);
        });

        els.themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            els.deleteDialog.classList.toggle('is-dark');
            requestRender();
        });

        els.resetViewBtn.addEventListener('click', () => {
            resetViewport();
            requestRender();
        });

        // --- Input Toggle ---
        function updateInputView() {
            if (els.radioLocal.checked) {
                els.localWrapper.classList.remove('hidden');
                els.urlWrapper.classList.add('hidden');
            } else {
                els.localWrapper.classList.add('hidden');
                els.urlWrapper.classList.remove('hidden');
            }
        }
        els.radioLocal.addEventListener('change', updateInputView);
        els.radioUrl.addEventListener('change', updateInputView);

        // --- Export Logic ---
        els.exportFormat.addEventListener('change', () => {
            if (els.exportFormat.value === 'png') {
                els.bgTransparentCheck.disabled = false;
            } else {
                els.bgTransparentCheck.disabled = true;
                els.bgTransparentCheck.checked = false;
            }
        });

        els.downloadBtn.addEventListener('click', () => {
            if (!activePreviewId || activePreviewId === 'original') {
                alert("Please select a GENERATED snapshot from the gallery below to download.");
                return;
            }

            const result = previewDataStore.get(activePreviewId);
            if (!result) return;

            const format = els.exportFormat.value;
            const isTransparent = els.bgTransparentCheck.checked;
            const isDark = document.body.classList.contains('dark-theme');

            const baseName = currentFilename.split('.')[0] || "image";
            const detailInfo = els.modeSelect.value === 'fourier' ? `T${els.termsRange.value}` : `D${els.detailRange.value}`;
            const filename = `vectomancy_${baseName}_${result.ast.type.toLowerCase()}_${detailInfo}`;

            if (format === 'json') {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(result.ast, null, 0));
                triggerDownload(dataStr, `${filename}.json`);
                return;
            }

            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = result.width;
            exportCanvas.height = result.height;
            const eCtx = exportCanvas.getContext('2d');

            if (!isTransparent || format === 'jpg') {
                eCtx.fillStyle = isDark ? '#1a1a1a' : '#ffffff';
                eCtx.fillRect(0, 0, result.width, result.height);
            }

            drawAST(eCtx, result.ast, false, isDark, true);

            const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';
            const quality = format === 'jpg' ? 0.9 : undefined;
            const dataUrl = exportCanvas.toDataURL(mimeType, quality);
            triggerDownload(dataUrl, `${filename}.${format}`);
        });

        function triggerDownload(dataUrl, filename) {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function handleImageBytes(buffer, filename) {
            currentImageBytes = new Uint8Array(buffer);
            currentFilename = filename;
            els.filenameDisplay.innerText = truncateMiddle(filename, 30);
            els.filenameDisplay.title = filename;

            const blob = new Blob([buffer]);
            const blobUrl = URL.createObjectURL(blob);

            originalImageObj = new Image();
            originalImageObj.onload = () => {
                const oldOrig = document.getElementById('gallery-original');
                if (oldOrig) oldOrig.remove();

                addGalleryItem('original', originalImageObj.src, 'ORIGINAL');
                activePreviewId = 'original';
                resetViewport();
                requestRender();
            };
            originalImageObj.src = blobUrl;
        }

        // --- File Handling ---
        els.fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const buffer = await file.arrayBuffer();
            handleImageBytes(buffer, file.name);
        });

        els.fetchUrlBtn.addEventListener('click', async () => {
            const url = els.urlInput.value;
            if (!url) return;
            els.loaderText.innerText = "Fetching URL...";
            els.loaderOverlay.classList.remove('hidden');
            try {
                // Warning: public URLs might face CORS issues without a proxy
                const response = await fetch(url);
                if (!response.ok) throw new Error("Fetch failed");
                const buffer = await response.arrayBuffer();
                const filename = url.split('/').pop().split('?')[0] || "downloaded_image";
                handleImageBytes(buffer, filename);
            } catch (err) {
                alert("Failed to fetch image. It might be blocked by CORS.");
            } finally {
                els.loaderOverlay.classList.add('hidden');
            }
        });

        // --- Preset Examples Handling ---
        document.querySelectorAll('.preset-example').forEach(img => {
            img.addEventListener('click', async (e) => {
                const url = e.target.src;
                const filename = e.target.getAttribute('data-filename');
                els.loaderText.innerText = "Loading Preset...";
                els.loaderOverlay.classList.remove('hidden');
                try {
                    const response = await fetch(url);
                    const buffer = await response.arrayBuffer();
                    handleImageBytes(buffer, filename);
                } catch (error) {
                    console.error("Error loading preset:", error);
                } finally {
                    els.loaderOverlay.classList.add('hidden');
                }
            });
        });

        // --- Generation Logic ---
        els.generateBtn.addEventListener('click', () => {
            if (!isWasmLoaded || !currentImageBytes) {
                alert("Please select an image first!");
                return;
            }

            els.statusText.innerText = "CALCULATING...";
            els.progressContainer.classList.remove('hidden');

            // Fake progress animation for visual feedback during block
            let p = 0;
            const pInt = setInterval(() => {
                p += 10;
                if(p > 90) clearInterval(pInt);
                els.progressBar.value = p;
            }, 20);

            const mode = els.modeSelect.value;
            const ext = currentFilename.split('.').pop().toLowerCase();
            const format = (ext === 'png' || ext === 'svg') ? ext : 'jpg';

            const options = {
                format: format,
                color: true,
                mode: mode,
                chaikin_iters: parseInt(els.chaikinRange.value),
                terms: parseInt(els.termsRange.value),
                detail: parseInt(els.detailRange.value),
                min_path_len: parseInt(els.minPathRange.value)
            };

            setTimeout(() => {
                try {
                    const start = performance.now();
                    const result = process_image(currentImageBytes, options);
                    const ms = Math.round(performance.now() - start);

                    snapshotCount++;
                    const id = `snap-${snapshotCount}`;
                    const label = `${mode.substring(0,3).toUpperCase()} D${options.detail}`;

                    createSnapshot(id, result, label, ms);

                    els.statusText.innerText = `DONE: ${ms}ms`;
                } catch (err) {
                    els.statusText.innerText = "ERR: FAILED";
                    console.error(err);
                } finally {
                    clearInterval(pInt);
                    els.progressBar.value = 100;
                    setTimeout(() => {
                        els.progressContainer.classList.add('hidden');
                        els.progressBar.value = 0;
                    }, 500);
                }
            }, 100); // give UI time to show progress bar
        });

        // --- Rendering & Multi-Preview ---
        function createSnapshot(id, result, label, computeTime) {
            const size = 128; // Smaller offscreen for memory
            const offscreen = document.createElement('canvas');
            offscreen.width = size;
            offscreen.height = size;
            const oCtx = offscreen.getContext('2d');

            oCtx.fillStyle = document.body.classList.contains('dark-theme') ? '#1a1a1a' : '#ffffff';
            oCtx.fillRect(0,0,size,size);

            const scale = Math.min(size / result.width, size / result.height) * 0.9;
            oCtx.translate((size - result.width * scale) / 2, (size - result.height * scale) / 2);
            oCtx.scale(scale, scale);

            drawAST(oCtx, result.ast, true, document.body.classList.contains('dark-theme'));

            const dataUrl = offscreen.toDataURL('image/webp', 0.5);

            result.computeTime = computeTime;
            previewDataStore.set(id, result);

            addGalleryItem(id, dataUrl, label);

            activePreviewId = id;
            resetViewport();
            requestRender();
        }

        // Custom Dialog Handlers
        els.deleteDialog.addEventListener('close', () => {
            if (els.deleteDialog.returnValue === 'confirm' && pendingDeleteId) {
                previewDataStore.delete(pendingDeleteId);
                document.getElementById(`gallery-${pendingDeleteId}`).remove();
                if (activePreviewId === pendingDeleteId) {
                    activePreviewId = 'original';
                    resetViewport();
                    requestRender();
                }
            }
            pendingDeleteId = null;
        });

        function addGalleryItem(id, src, labelText) {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.id = `gallery-${id}`;

            let innerHTML = `<img src="${src}"><div class="gallery-label">${labelText}</div>`;
            if (id !== 'original') {
                innerHTML += `<div class="gallery-delete" title="Delete">X</div>`;
            }
            item.innerHTML = innerHTML;

            item.onclick = (e) => {
                if (e.target.classList.contains('gallery-delete')) {
                    e.stopPropagation();
                    pendingDeleteId = id;
                    // Fix dialog rendering issue in some browsers
                    if (typeof els.deleteDialog.showModal === "function") {
                      els.deleteDialog.showModal();
                    } else {
                      els.deleteDialog.setAttribute("open", "true");
                    }
                    return;
                }
                document.querySelectorAll('.gallery-item').forEach(c => c.classList.remove('active'));
                item.classList.add('active');
                activePreviewId = id;
                resetViewport();
                requestRender();
            };
            els.gallery.prepend(item);
            if(id === 'original') item.click();
        }

        // --- Viewport Panning & Zooming ---
        function resetViewport() {
            scale = 1;
            const targetWidth = activePreviewId === 'original' ? originalImageObj.width : previewDataStore.get(activePreviewId).width;
            const targetHeight = activePreviewId === 'original' ? originalImageObj.height : previewDataStore.get(activePreviewId).height;

            const areaRect = els.canvasArea.getBoundingClientRect();
            const scaleX = (areaRect.width * 0.8) / targetWidth;
            const scaleY = (areaRect.height * 0.8) / targetHeight;
            scale = Math.min(scaleX, scaleY);
            if(scale > 2) scale = 2;

            offsetX = (areaRect.width - targetWidth * scale) / 2;
            offsetY = (areaRect.height - targetHeight * scale) / 2;
        }

        els.canvasArea.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStart = { x: e.clientX - offsetX, y: e.clientY - offsetY };
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            offsetX = e.clientX - dragStart.x;
            offsetY = e.clientY - dragStart.y;
            requestRender();
        });
        window.addEventListener('mouseup', () => { isDragging = false; });
        els.canvasArea.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            const wheel = e.deltaY < 0 ? 1 : -1;
            const zoomFactor = Math.exp(wheel * zoomIntensity);

            const rect = els.canvasArea.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            offsetX = mouseX - (mouseX - offsetX) * zoomFactor;
            offsetY = mouseY - (mouseY - offsetY) * zoomFactor;
            scale *= zoomFactor;

            requestRender();
        });

        // --- Core Drawing ---
        function requestRender() {
            if (!renderRequested) {
                renderRequested = true;
                requestAnimationFrame(renderViewport);
            }
        }

        function renderViewport() {
            renderRequested = false;

            const rect = els.canvasArea.getBoundingClientRect();
            els.mainCanvas.width = rect.width;
            els.mainCanvas.height = rect.height;

            ctx.clearRect(0, 0, els.mainCanvas.width, els.mainCanvas.height);

            document.querySelectorAll('.gallery-item').forEach(el => el.classList.remove('active'));
            const activeGalleryItem = document.getElementById(`gallery-${activePreviewId}`);
            if (activeGalleryItem) activeGalleryItem.classList.add('active');

            if (!activePreviewId) return;

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            const isDark = document.body.classList.contains('dark-theme');

            if (activePreviewId === 'original') {
                if (originalImageObj) {
                    ctx.drawImage(originalImageObj, 0, 0);
                    updateOverlayStats(`ORIGINAL IMAGE\nSIZE: ${originalImageObj.width}x${originalImageObj.height}`);
                }
            } else {
                const result = previewDataStore.get(activePreviewId);
                if (result) {
                    drawAST(ctx, result.ast, false, isDark);

                    let memoryMB = (JSON.stringify(result).length / (1024*1024)).toFixed(2);
                    let statsText = `WASM RENDER\nSIZE: ${result.width}x${result.height}\nTIME: ${result.computeTime}ms\nMEM: ${memoryMB} MB`;
                    if (result.ast.type === 'Spline' || result.ast.type === 'spline') {
                        statsText += `\nPATHS: ${result.ast.equations.length}`;
                    } else if (result.ast.type === 'Fourier' || result.ast.type === 'fourier') {
                        statsText += `\nSTROKES: ${result.ast.strokes.length}`;
                    }
                    updateOverlayStats(statsText);
                }
            }

            ctx.restore();
        }

        function updateOverlayStats(text) {
            els.overlayStats.innerText = text;
        }

        function drawAST(ctx, ast, isThumbnail, isDarkTheme = false, isExport = false) {
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            let currentStrokeW = isThumbnail ? 3.0 : (isExport ? 1.5 : (1.5 / Math.max(scale, 0.1)));
            ctx.lineWidth = currentStrokeW;

            const defaultColor = isDarkTheme ? '#ffffff' : '#000000';
            const extractColor = els.colorCheck.checked || isThumbnail || isExport;

            if (ast.type === 'Spline' || ast.type === 'spline') {
                for (const path of ast.equations) {
                    ctx.strokeStyle = (path.color_rgb && extractColor) ?
                        `rgb(${path.color_rgb[0]},${path.color_rgb[1]},${path.color_rgb[2]})` : defaultColor;

                    for (const eq of path.data) {
                        ctx.beginPath();
                        let first = true;
                        let step = isThumbnail ? 0.2 : 0.05;
                        for (let t = 0; t <= 1.0; t += step) {
                            let x = eq.x_poly[0] + eq.x_poly[1]*t + eq.x_poly[2]*t*t + eq.x_poly[3]*t*t*t;
                            let y = eq.y_poly[0] + eq.y_poly[1]*t + eq.y_poly[2]*t*t + eq.y_poly[3]*t*t*t;
                            if (first) { ctx.moveTo(x, y); first = false; } else { ctx.lineTo(x, y); }
                        }
                        ctx.stroke();
                    }
                }
            } else if (ast.type === 'Fourier' || ast.type === 'fourier') {
                for (const stroke of ast.strokes) {
                    ctx.strokeStyle = (stroke.color_rgb && extractColor) ?
                        `rgb(${stroke.color_rgb[0]},${stroke.color_rgb[1]},${stroke.color_rgb[2]})` : defaultColor;

                    ctx.beginPath();
                    let first = true;
                    const steps = Math.min(stroke.data.length * 4, isThumbnail ? 100 : 2000);
                    for (let i = 0; i <= steps; i++) {
                        let t = (i / steps) * Math.PI * 2;
                        let x = 0, y = 0;
                        for (const term of stroke.data) {
                            x += term.amplitude * Math.cos(term.frequency * t + term.phase);
                            y += term.amplitude * Math.sin(term.frequency * t + term.phase);
                        }
                        if (first) { ctx.moveTo(x, y); first = false; } else { ctx.lineTo(x, y); }
                    }
                    ctx.stroke();
                }
            } else if (ast.type === 'Polyline' || ast.type === 'polyline') {
                 for (const path of ast.paths) {
                    ctx.strokeStyle = (path.color_rgb && extractColor) ?
                        `rgb(${path.color_rgb[0]},${path.color_rgb[1]},${path.color_rgb[2]})` : defaultColor;

                    ctx.beginPath();
                    let first = true;
                    for (const pt of path.data) {
                        if (first) { ctx.moveTo(pt.x, pt.y); first = false; } else { ctx.lineTo(pt.x, pt.y); }
                    }
                    ctx.stroke();
                 }
            }
        }

        // --- Init ---
        run();
    </script>
</body>
</html>
