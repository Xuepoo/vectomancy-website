<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Xuepoo | Creative Engineer</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: 'Outfit', sans-serif;
    background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #f0f9ff 100%);
    color: #0f172a;
    overflow-x: hidden;
  }

  /* Interactive Background Canvas */
  #canvas-container {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: 1;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }

  /* UI Layer (Above Canvas but allows clicks to pass through) */
  #ui-layer {
    position: relative;
    z-index: 10;
    pointer-events: none; /* Let clicks hit canvas */
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  /* Make buttons and links clickable again */
  nav, .btn, .social-links a { pointer-events: auto; }

  nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2rem 5%;
    background: linear-gradient(180deg, rgba(240,249,255,0.9) 0%, rgba(240,249,255,0) 100%);
  }
  .logo { font-weight: 900; font-size: 1.8rem; letter-spacing: -1px; color: #0284c7; }
  .logo span { color: #38bdf8; }
  .nav-links { display: flex; gap: 2rem; font-weight: 600; }
  .nav-links a { color: #334155; text-decoration: none; transition: 0.3s; }
  .nav-links a:hover { color: #0284c7; }

  .hero {
    flex: 1;
    display: flex; align-items: center;
    padding: 0 5%;
  }
  .hero-content {
    max-width: 600px;
    z-index: 10;
  }

  h1 {
    font-size: 5rem;
    font-weight: 900;
    line-height: 1.1;
    margin: 0 0 1.5rem 0;
    color: #0f172a;
  }

  .highlight {
    background: linear-gradient(45deg, #0284c7 0%, #38bdf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p.subtitle {
    font-size: 1.25rem;
    color: #475569;
    line-height: 1.6;
    margin-bottom: 2.5rem;
    font-weight: 400;
  }

  .btn {
    display: inline-block;
    padding: 1rem 2.5rem;
    font-size: 1.1rem;
    font-weight: 600;
    color: #0f172a;
    background: rgba(255, 255, 255, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 4px 15px rgba(2, 132, 199, 0.1);
    border-radius: 50px;
    text-decoration: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: 0.3s;
    cursor: pointer;
  }
  .btn:hover {
    background: #0284c7;
    color: #fff;
    border-color: #0284c7;
    box-shadow: 0 8px 25px rgba(2, 132, 199, 0.3);
  }

  #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: 600; color: #0284c7; z-index: 100; pointer-events: none; }
  #a11y-tree { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }

  /* Feedback UI */
  .floating-btn {
    position: fixed; bottom: 30px; right: 30px; z-index: 100;
    padding: 12px 24px; font-family: 'Outfit', sans-serif;
    font-weight: 600; color: #fff; background: #0284c7;
    border: none; border-radius: 50px; cursor: pointer; pointer-events: auto;
    box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3); transition: 0.3s;
  }
  .floating-btn:hover { background: #0369a1; transform: translateY(-2px); }

  #feedback-modal {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(15, 23, 42, 0.4); z-index: 200;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    opacity: 1; transition: 0.3s; pointer-events: auto;
  }
  #feedback-modal.hidden { opacity: 0; pointer-events: none; }

  .modal-content {
    background: #fff; padding: 2rem; border-radius: 16px; width: 400px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.1); color: #0f172a;
  }
  .modal-content h2 { margin: 0 0 1rem 0; font-size: 1.5rem; }
  .modal-content textarea {
    width: 100%; height: 120px; padding: 10px; border-radius: 8px;
    border: 1px solid #cbd5e1; font-family: 'Outfit', sans-serif;
    resize: none; margin-bottom: 1rem;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .btn.secondary { background: #f1f5f9; color: #475569; box-shadow: none; border: 1px solid #e2e8f0; }
  .btn.secondary:hover { background: #e2e8f0; color: #0f172a; border-color: #e2e8f0; }
</style>
</head>
<body>

  <div id="loader">Waking up Engine...</div>

  <div id="canvas-container">
    <canvas id="app"></canvas>
  </div>

  <div id="ui-layer">
    <nav>
      <div class="logo">Xuepoo<span>.</span></div>
      <div class="nav-links">
        <a href="#">Works</a>
        <a href="#">Lab</a>
        <a href="#">About</a>
      </div>
    </nav>

    <div class="hero">
      <div class="hero-content">
        <!-- Text is now rendered via Vectomancy Canvas AST! -->
        <div style="height: 350px;"></div> <!-- Spacer for the interactive text -->
        <a href="#" class="btn" style="margin-left: 2.5rem;">Explore My Work</a>
      </div>
    </div>
  </div>

  <button id="feedback-btn" class="floating-btn">💬 Feedback</button>

  <div id="feedback-modal" class="hidden">
    <div class="modal-content">
      <h2>Send Feedback</h2>
      <textarea id="feedback-text" placeholder="Found a bug? Have an idea? Let us know!"></textarea>
      <div class="modal-actions">
        <button id="close-feedback" class="btn secondary">Cancel</button>
        <button id="submit-feedback" class="btn">Submit</button>
      </div>
    </div>
  </div>

  <div id="a11y-tree"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
