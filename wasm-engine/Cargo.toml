[package]
name = "wasm-engine"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bridge for Vectomancy"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

vectomancy = { path = "../../vectomancy", version = "5.0.0", default-features = false, features = ["image", "svg"] }
vectomancy-text = { path = "../../vectomancy/text", version = "5.0.0" }
getrandom = { version = "0.2", features = ["js"] }
bincode = "1.3"
once_cell = "1.18"


[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "z"       # Optimize for size
lto = true            # Enable Link Time Optimization
codegen-units = 1     # Reduce parallel code generation units for better optimization
panic = "abort"       # Remove panic unwinding
