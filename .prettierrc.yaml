printWidth: 100
tabWidth: 2
useTabs: false
semi: true
singleQuote: false
trailingComma: all
bracketSpacing: true
endOfLine: lf
proseWrap: preserve
htmlWhitespaceSensitivity: css
overrides:
  - files: "*.html"
    options:
      # Zola templates use long lines; use a wider printWidth
      printWidth: 160
      # Don't reformat Tera/Jinja2 template delimiters
      embeddedLanguageFormatting: off
  - files: "zola-site/functions/**/*.js"
    options:
      printWidth: 100
      singleQuote: false
